<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0B1020">
    <title>404 | Pagina no encontrada - duduDev</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0B1020;
            color: #F8FAFC;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 560px;
        }

        .code {
            font-size: clamp(100px, 25vw, 180px);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(120deg, #2563EB, #06B6D4, #A855F7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        h1 {
            margin: 20px 0 12px;
            font-size: 28px;
        }

        p {
            color: #94A3B8;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 28px;
            padding: 13px 24px;
            border-radius: 9px;
            background: #2563EB;
            color: white;
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            background: #1D4ED8;
        }

        footer {
            margin-top: 60px;
            color: #64748B;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main>
        <div class="code">404</div>
        <h1>Pagina no encontrada</h1>
        <p>
            La direccion que buscas no existe o fue modificada.
            Regresa al inicio para continuar explorando duduDev.
        </p>

        <a href="./">Volver al inicio</a>

        <footer>
            duduDev · Construyendo soluciones digitales.
        </footer>
    </main>
</body>
</html>
